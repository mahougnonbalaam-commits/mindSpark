<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindSpark AI — Studio de Création & Idées Virales</title>
    <meta name="description" content="Assistant intelligent pour créateurs de contenu vidéo court, storytelling et faceless vidéos." />
    <script>
      // Apply the saved theme before first paint to avoid a dark/light flash
      try {
        var saved = JSON.parse(localStorage.getItem('mindspark_settings') || '{}');
        document.documentElement.classList.add(saved.theme === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.classList.add('light');
      }
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-dark-950 text-slate-800 dark:text-zinc-100 antialiased selection:bg-spark-500/30 selection:text-spark-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
